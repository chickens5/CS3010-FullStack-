<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden App</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Eden</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link button" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link button" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link button" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link button" href="account.html">Account</a></li>
                    <li class="nav-item"><a class="nav-link button" href="garden_app.html">Garden App</a></li>
                    <li class="nav-item"><a class="nav-link button" href="logout.html">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<!-- Title Container -->
<div class="title-container text-center">
    <h1 style="color: #e0f7fa;">Welcome to the Garden App</h1>
</div>

<!-- Garden App Container -->
<div class="garden-app-container">
    <p>This is a placeholder for the Garden App. The interactive interface will be displayed here.</p>
    <button class="button" id="fullscreen-btn">Go Fullscreen</button>
</div>

<footer>
    <div id="footer-container"></div>
    <script src="footer.js"></script>
</footer>

<!-- JavaScript for Fullscreen Mode -->
<script>
    document.getElementById('fullscreen-btn').addEventListener('click', function() {
        let elem = document.querySelector('.garden-app-container');
        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        } else if (elem.mozRequestFullScreen) {
            elem.mozRequestFullScreen();
        } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
        }
    });
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
