<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Eden</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link button" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link button" href="garden_app.html">Garden App</a></li>
          <li class="nav-item"><a class="nav-link button" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link button" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link button" href="account.html">Account</a></li>
          <li class="nav-item"><a class="nav-link button" href="logout.html">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<!-- Title Container -->
<div class="title-container text-center">
  <h1 style="color: #e0f7fa;">Login</h1>
</div>

<!-- Login Form -->
<div class="content-container">
  <form action="#" method="post" class="login-form">
    <div class="form-group">
      <label for="username">User Name:</label>
      <input type="text" id="username" name="username" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>

    <div class="button-group">
      <button type="submit" class="button">Login</button>
      <button type="reset" class="button">Reset</button>
    </div>
  </form>
</div>

<footer>
  <div id="footer-container"></div>
  <script src="footer.js"></script>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
