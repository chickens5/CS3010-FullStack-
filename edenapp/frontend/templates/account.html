<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account</title>
  <link rel="stylesheet" href="../.idea/styles.css">
</head>
<body>
<header>
   <nav class="navbar">
    <a class="navbar-brand">Eden</a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="register.html">Register</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="account.html">Account</a></li>
      <li><a href="garden_app.html">Eden</a></li>
      <li><a href="logout.html">Logout</a></li>
    </ul>
  </nav>
</header>

<!-- Title Container -->
<div class="title-container">
  <h1 style = text-align:center;>My Eden</h1>
</div>

<!-- Account Info Section -->
<div class="account-container">
  <h2>Account Details</h2>

  <form id="account-button">
    <div class="form-group">
      <label for="first-name">First Name:</label>
      <input type="text" id="first-name" name="first-name" required>
    </div>

    <div class="form-group">
      <label for="last-name">Last Name:</label>
      <input type="text" id="last-name" name="last-name" required>
    </div>

    <div class="form-group">
      <label for="address1">Address Line 1:</label>
      <input type="text" id="address1" name="address1" required>
    </div>

    <div class="form-group">
      <label for="address2">Address Line 2:</label>
      <input type="text" id="address2" name="address2">
    </div>

    <div class="form-group">
      <label for="city">City:</label>
      <input type="text" id="city" name="city" required>
    </div>

    <div class="form-group">
      <label for="state">State:</label>
      <select id="state" name="state" required>
        <option value="">Select State</option>
        <option value="MO">Missouri</option>
        <option value="IL">Illinois</option>
        <option value="CA">California</option>
        <option value="NY">New York</option>
        <option value="TX">Texas</option>
        <option value="FL">Florida</option>
      </select>
    </div>

    <div class="form-group">
      <label for="zip">Zip Code:</label>
      <input type="text" id="zip" name="zip" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number:</label>
      <input type="text" id="phone" name="phone" required>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="button-group">
      <button type="submit" class="form-button">Submit</button>
      <button type="reset" class="form-button">Reset</button>
      <button class="account-button">Edit Profile</button>
      <button class="account-button">Change Password</button>
      <button class="account-button">Logout</button>

    </div>
  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
